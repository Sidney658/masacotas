<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Mascotas</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f1f2b5, #135058);
      color: #333;
    }

    header {
      background-color: #0abde3;
      padding: 20px 0;
      text-align: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    h1 {
      margin: 0;
      font-size: 2em;
    }

    form {
      background-color: white;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
      color: #2d3436;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      width: 100%;
      background-color: #00b894;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #019875;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      color: #dfe6e9;
    }
  </style>
</head>
<body>

  <header>
    <h1>Formulario de Registro de Mascotas</h1>
  </header>

  <form action="#" method="post">
    <label for="nombre">🐾 Nombre de la Mascota:</label>
    <input type="text" id="nombre" name="nombre" required />

    <label for="especie">🐕 Especie:</label>
    <select id="especie" name="especie" required>
      <option value="">Selecciona una opción</option>
      <option value="perro">Perro</option>
      <option value="gato">Gato</option>
      <option value="ave">Ave</option>
      <option value="otro">Otro</option>
    </select>

    <label for="raza">🏷️ Raza:</label>
    <input type="text" id="raza" name="raza" />

    <label for="genero">⚥ Género:</label>
    <select id="genero" name="genero" required>
      <option value="">Selecciona una opción</option>
      <option value="macho">Macho</option>
      <option value="hembra">Hembra</option>
    </select>

    <label for="edad">📅 Edad (en años):</label>
    <input type="number" id="edad" name="edad" min="0" />

    <label for="observaciones">📝 Observaciones:</label>
    <textarea id="observaciones" name="observaciones" rows="4"></textarea>

    <button type="submit">Registrar Mascota</button>
  </form>

  <footer>
    &copy; 2025 Registro de Mascotas | Hecho con 🐾 
  </footer>

</body>
</html>
